<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Помощник">
<meta name="theme-color" content="#f7f4ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Домашний помощник</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap');
:root{
  --bg:#f7f4ee;--surface:#fff;--surface2:#f0ece2;--border:#e8e2d6;
  --text:#3a3328;--text2:#8a8070;--text3:#c2b9a8;
  --accent:#5b8a64;--accent-light:#e3ece2;
  --green:#5b8a64;--green-bg:#e3ece2;
  --yellow:#c08a3e;--yellow-bg:#f6e4da;
  --red:#b8543a;--red-bg:#f6e4da;
  --blue:#4a6fa5;--blue-bg:#edf1f9;
  --shadow:0 1px 2px rgba(0,0,0,0.04),0 4px 16px rgba(0,0,0,0.05);
  --r:16px;--r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100%;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;-webkit-appearance:none}
input,select,textarea{-webkit-appearance:none}

.hdr{background:var(--surface);padding:env(safe-area-inset-top,44px) 20px 13px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60}
.hdr-title{font-size:18px;font-weight:300;letter-spacing:1.5px;text-align:center;color:var(--text2);font-style:italic}

.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:60;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;padding:9px 4px 14px;border:none;background:none;color:var(--text3);font-size:9px;font-weight:500;letter-spacing:0.3px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .15s}
.nav-btn.active{color:var(--accent)}
.ns{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.content{padding:12px 14px 80px}
.tab{display:none}.tab.active{display:block}
.sec{margin-bottom:18px}
.sec-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);padding:0 2px;margin-bottom:7px}

.search-row{display:flex;gap:8px;margin-bottom:11px;align-items:center}
.search{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0 13px;display:flex;align-items:center;gap:9px;flex:1;box-shadow:var(--shadow)}
.search input{flex:1;border:none;background:none;padding:10px 0;font-size:15px;outline:none;color:var(--text)}
.search input::placeholder{color:var(--text3)}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--text2);box-shadow:var(--shadow);white-space:nowrap;flex-shrink:0;min-height:42px}
.icon-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ITEM CARD */
.card{background:var(--surface);border-radius:var(--r);margin-bottom:2px;overflow:hidden;box-shadow:var(--shadow)}
.item-row{display:flex;align-items:center;padding:12px 15px;gap:11px;min-height:48px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.dot.много{background:var(--green)}.dot.норм{background:var(--yellow)}.dot.заканчивается{background:var(--red)}.dot.нет{background:var(--border);box-shadow:0 0 0 2px var(--red)}
.item-name{flex:1;font-size:15px;line-height:1.3}
.item-price{font-size:13px;color:var(--text3)}
.item-price.set{color:var(--text2);font-weight:500}
.chev{color:var(--text3);font-size:13px;margin-left:4px;transition:transform .2s;display:inline-block}
.chev.open{transform:rotate(90deg)}

/* LEVEL 1 */
.item-d1{display:none;padding:0 15px 12px;border-top:1px solid var(--surface2)}
.item-d1.open{display:block}
.stock-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.spill{padding:7px 13px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:500;background:none;color:var(--text2);min-height:36px}
.spill.a-много{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.spill.a-норм{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow)}
.spill.a-заканчивается{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.spill.a-нет{background:#f5f5f5;border-color:var(--text3);color:var(--text2)}
.d1-actions{display:flex;gap:7px;margin-top:4px}
.d1-btn{flex:1;padding:9px 8px;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:500;min-height:38px}
.d1-list{background:var(--accent-light);color:var(--accent)}
.d1-list.in{background:var(--green-bg);color:var(--green)}
.d1-more{background:var(--surface2);color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px}
.d1-edit{background:var(--surface2);color:var(--text2);flex:0;padding:9px 14px}

/* LEVEL 2 — price, url, notes + ONE save button */
.item-d2{display:none;padding:0 15px 14px;border-top:1px solid var(--surface2)}
.item-d2.open{display:block}
.d2-field{margin-bottom:10px}
.d2-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
.d2-inp{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;font-size:15px;outline:none;color:var(--text);background:var(--surface);min-height:40px}
.d2-inp:focus{border-color:var(--accent)}
.d2-url-row{display:flex;gap:7px;align-items:center}
.d2-url-inp{flex:1;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;outline:none;color:var(--text);background:var(--surface);min-height:40px}
.d2-url-inp:focus{border-color:var(--accent)}
.d2-url-open{background:var(--blue-bg);border:none;border-radius:var(--r-sm);padding:9px 12px;font-size:13px;color:var(--blue);font-weight:500;min-height:40px;white-space:nowrap}
.d2-notes{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;outline:none;resize:none;color:var(--text);min-height:66px;line-height:1.4;background:var(--surface)}
.d2-notes:focus{border-color:var(--accent)}
.price-hist{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.price-hist-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);padding:3px 8px;background:var(--surface2);border-radius:6px}
/* Single save button for all level-2 fields */
.d2-save-all{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:11px;font-size:15px;font-weight:600;min-height:44px}
.d2-del{width:100%;background:none;border:none;color:var(--text3);font-size:13px;padding:8px;margin-top:4px;min-height:36px}

/* SHOP */
.total-wrap{background:var(--accent);border-radius:var(--r);padding:18px 20px;margin-bottom:13px;box-shadow:var(--shadow)}
.total-lbl{font-size:11px;font-weight:500;color:rgba(255,255,255,0.7);letter-spacing:0.4px;text-transform:uppercase;margin-bottom:4px}
.total-amt{font-size:36px;font-weight:700;color:#fff;letter-spacing:-1px;line-height:1}
.total-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:7px}
.total-count{font-size:12px;color:rgba(255,255,255,0.65);flex:1}
.total-btn{background:rgba(255,255,255,0.18);border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:500;color:#fff;min-height:34px}
.total-btn.danger{background:rgba(255,80,80,0.3)}
.list-acts{display:flex;gap:8px;margin-bottom:13px}
.list-act{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 7px;font-size:13px;font-weight:500;color:var(--accent);box-shadow:var(--shadow);min-height:42px}
.shop-item{background:var(--surface);border-radius:var(--r);margin-bottom:2px;display:flex;align-items:center;gap:9px;padding:10px 13px;box-shadow:var(--shadow);min-height:52px}
.shop-chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s}
.shop-chk.on{background:var(--green);border-color:var(--green);color:#fff}
.shop-name-col{flex:1;min-width:0}
.shop-name-text{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-name-text.done{text-decoration:line-through;color:var(--text3)}
.shop-sub{font-size:11px;color:var(--text3);margin-top:1px}
.shop-qty-col{display:flex;align-items:center;gap:3px;flex-shrink:0}
.shop-qty-inp{width:50px;border:1px solid var(--border);border-radius:7px;padding:5px 6px;font-size:13px;text-align:center;outline:none;color:var(--text);background:var(--surface2);min-height:34px}
.shop-qty-inp:focus{border-color:var(--accent);background:var(--surface)}
.shop-qty-unit{font-size:11px;color:var(--text3);min-width:20px}
.shop-price-col{font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;flex-shrink:0}
.shop-del{background:none;border:none;color:var(--text3);font-size:18px;padding:0 0 0 5px;flex-shrink:0;min-width:28px;min-height:36px}

/* MEALS */
.meal-subtabs{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:14px;gap:2px}
.mst{flex:1;padding:8px 4px;border:none;background:none;font-size:12px;font-weight:500;color:var(--text2);border-radius:10px;transition:all .15s;text-align:center;min-height:38px}
.mst.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.08);font-weight:600}

/* RECIPE GRID */
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recipe-tile{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:opacity .15s}
.recipe-tile:active{opacity:.8}
.recipe-tile-img{aspect-ratio:1/1;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.recipe-tile-img img{width:100%;height:100%;object-fit:cover;display:block}
.recipe-tile-body{padding:8px 10px 11px}
.recipe-tile-name{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recipe-tile-meta{font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:4px}
.recipe-tile-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px}

/* RECIPE DETAIL (inline) */
.rdm-photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--surface2);border-radius:var(--r);margin-bottom:14px}
.rdm-photo-ph{width:100%;aspect-ratio:16/9;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:40px;border-radius:var(--r);margin-bottom:14px}
.rdm-back{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 14px;font-size:13px;font-weight:500;color:var(--text2);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;min-height:36px}
.rdm-title{font-size:20px;font-weight:700;letter-spacing:-0.3px;line-height:1.25;margin-bottom:12px}
.rdm-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rdm-instructions{font-size:14px;line-height:1.65;color:var(--text2);white-space:pre-wrap;background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:4px}

.recipe-name{font-size:16px;font-weight:600;letter-spacing:-0.2px;margin-bottom:4px}
.recipe-meta{font-size:12px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap}
.recipe-btns{display:flex;gap:6px;flex-wrap:wrap}
.rec-btn{padding:8px 9px;border:none;border-radius:var(--r-sm);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;min-height:36px}
.rec-btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.rb-edit{background:var(--accent-light);color:var(--accent)}
.rb-plan{background:var(--blue-bg);color:var(--blue)}
.rb-cook{background:var(--green-bg);color:var(--green)}
.rb-back{background:var(--yellow-bg);color:var(--yellow)}
.rb-shop{background:var(--accent);color:#fff}
.rb-del{background:var(--red-bg);color:var(--red)}
.detail-hdr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text3);margin:14px 0 7px}
.detail-hdr:first-child{margin-top:0}
.ing-check-list{display:flex;flex-direction:column;gap:4px}
.ing-row{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--r-sm);font-size:14px}
.ing-row.ok{background:var(--green-bg);color:var(--green)}
.ing-row.low{background:var(--yellow-bg);color:var(--yellow)}
.ing-row.missing{background:var(--red-bg);color:var(--red)}
.ing-row.unknown{background:var(--surface2);color:var(--text2)}
.ing-ico{font-size:12px;flex-shrink:0;width:13px;text-align:center}
.ing-ing{flex:1;font-weight:500;font-size:13px}
.ing-amt-tag{font-size:11px;opacity:.8;white-space:nowrap}
.ing-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
.ing-cart-btn{background:rgba(0,0,0,0.09);border:none;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;color:inherit;flex-shrink:0;min-height:26px;transition:all .2s}

/* ING SEARCH IN RECIPE MODAL */
.ing-search-wrap{position:relative;flex:1}
.ing-move-btn{background:none;border:1px solid var(--border);border-radius:5px;color:var(--text3);font-size:12px;padding:0;width:22px;min-height:22px;display:flex;align-items:center;justify-content:center;line-height:1}
.ing-move-btn:disabled{opacity:.2}

.cooked-card{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);display:flex}
.cooked-photo{width:86px;flex-shrink:0;object-fit:cover;display:block;background:var(--surface2)}
.cooked-photo-ph{width:86px;flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text3)}
.cooked-info{flex:1;padding:11px 12px}
.cooked-name{font-size:15px;font-weight:600;margin-bottom:4px}
.cooked-status{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;padding:3px 7px;border-radius:20px;margin-bottom:5px}
.st-fresh{background:var(--green-bg);color:var(--green)}
.st-frozen{background:var(--blue-bg);color:var(--blue)}
.st-semi{background:var(--yellow-bg);color:var(--yellow)}
.cooked-date{font-size:11px;color:var(--text3);margin-bottom:7px}
.portion-row{display:flex;align-items:center;gap:6px}
.port-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:none;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.port-n{font-size:17px;font-weight:700;min-width:22px;text-align:center}
.port-lbl{font-size:11px;color:var(--text3)}
.cooked-del{background:none;border:none;color:var(--text3);padding:11px;font-size:17px;align-self:flex-start;flex-shrink:0}

.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);right:calc(50% - 224px);width:50px;height:50px;background:var(--accent);border-radius:50%;border:none;color:#fff;font-size:26px;box-shadow:0 4px 20px rgba(107,83,68,0.4);display:flex;align-items:center;justify-content:center;z-index:55}
@media(max-width:480px){.fab{right:16px}}

.overlay{display:none;position:fixed;inset:0;background:rgba(20,16,12,0.5);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 36px);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-handle{width:30px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:19px;font-weight:700;letter-spacing:-0.3px;margin-bottom:18px}
.fl{margin-bottom:13px}
.fl label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:0.2px}
.fi{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;font-size:16px;outline:none;color:var(--text);background:var(--surface);min-height:44px}
.fi:focus{border-color:var(--accent)}
.fsel-m{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;font-size:16px;outline:none;color:var(--text);background:var(--surface);appearance:none;min-height:44px}
.btn-row{display:flex;gap:9px;margin-top:7px}
.btn-ok{flex:2;background:var(--accent);color:#fff;border:none;border-radius:13px;padding:14px;font-size:16px;font-weight:600;min-height:50px}
.btn-cancel{flex:1;background:var(--surface2);border:none;border-radius:13px;padding:14px;font-size:16px;color:var(--text2);min-height:50px}

.photo-upload{width:100%;height:120px;border:2px dashed var(--border);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;background:var(--surface2);overflow:hidden;position:relative}
.photo-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-upload-txt{font-size:13px;color:var(--text3);position:relative}
.photo-ico-up{font-size:24px;position:relative}
input[type=file]{display:none}

.ing-modal-list{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.ing-modal-row{display:flex;gap:7px;align-items:center;background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px}
.ing-m-name{flex:1;font-size:14px;font-weight:500}
.ing-m-amt{font-size:12px;color:var(--text2);white-space:nowrap}
.ing-m-del{background:none;border:none;color:var(--text3);font-size:16px;padding:0;line-height:1;min-width:28px;min-height:28px}
.ing-add-row{display:flex;gap:5px;align-items:center}
.ing-add-plus{width:40px;height:40px;border-radius:var(--r-sm);background:var(--accent);border:none;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ing-add-name{flex:1;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;font-size:14px;outline:none;background:var(--surface);min-width:0;min-height:40px}
.ing-add-name:focus{border-color:var(--accent)}
.ing-add-amt{width:56px;flex-shrink:0;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 7px;font-size:14px;outline:none;background:var(--surface);min-height:40px}
.ing-add-unit{width:65px;flex-shrink:0;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 4px;font-size:13px;outline:none;background:var(--surface);appearance:none;min-height:40px}

.status-opts{display:flex;flex-direction:column;gap:7px}
.sopt{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;min-height:46px}
.sopt input{accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}
.sopt:has(input:checked){border-color:var(--accent);background:var(--accent-light)}

.check-row{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;margin-top:9px;min-height:46px}
.check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.check-row:has(input:checked){border-color:var(--accent);background:var(--accent-light)}

.filter-section{margin-bottom:16px}
.filter-section-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:9px}
.filter-pills{display:flex;flex-wrap:wrap;gap:7px}
.fpill{padding:7px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface2);font-size:13px;font-weight:500;color:var(--text2);min-height:36px}
.fpill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fpill.f-много.on{background:var(--green);border-color:var(--green)}
.fpill.f-норм.on{background:var(--yellow);border-color:var(--yellow)}
.fpill.f-заканчивается.on{background:var(--red);border-color:var(--red)}
.fpill.f-нет.on{background:var(--text2);border-color:var(--text2)}

.sort-list{display:flex;flex-direction:column;gap:4px}
.sort-item{display:flex;align-items:center;gap:9px;background:var(--surface2);border-radius:var(--r-sm);padding:10px 13px;min-height:46px}
.sort-name{flex:1;font-size:15px;font-weight:500}
.sort-arrows{display:flex;gap:6px}
.sort-arrows button{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:14px;color:var(--text2);min-width:36px;min-height:36px}

.new-cat-row{display:none;margin-top:7px}
.new-cat-row input{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:15px;outline:none;min-height:42px}
.new-cat-row input:focus{border-color:var(--accent)}

.shop-search-wrap{position:relative;margin-bottom:13px}
.shop-search-inp{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;font-size:16px;outline:none;color:var(--text);background:var(--surface);min-height:44px}
.shop-search-inp:focus{border-color:var(--accent)}
.shop-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:10;max-height:220px;overflow-y:auto;display:none}
.shop-dropdown.open{display:block}
.sdrop-item{padding:11px 13px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:9px;min-height:44px;border-bottom:1px solid var(--surface2)}
.sdrop-item:last-child{border-bottom:none}
.sdrop-item:active{background:var(--surface2)}
.sdrop-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sdrop-name{flex:1;font-weight:500}
.sdrop-cat{font-size:11px;color:var(--text3)}
.sdrop-new{color:var(--accent);font-weight:600}
.selected-chip{display:flex;align-items:center;gap:8px;background:var(--accent-light);border:1.5px solid var(--accent);border-radius:var(--r-sm);padding:9px 13px;margin-bottom:13px}
.selected-chip-name{flex:1;font-size:14px;font-weight:600;color:var(--accent)}
.selected-chip-clear{background:none;border:none;color:var(--accent);font-size:16px;padding:0;min-width:24px;min-height:24px}

.pick-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.pick-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface2);border-radius:var(--r-sm);cursor:pointer;min-height:52px}
.pick-item:active{background:var(--border)}
.pick-photo{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--border)}
.pick-photo-ph{width:40px;height:40px;border-radius:9px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pick-name{flex:1;font-size:15px;font-weight:500}
.pick-meta{font-size:12px;color:var(--text3)}
.pick-search{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 13px;font-size:15px;outline:none;margin-bottom:11px;background:var(--surface);min-height:42px}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);left:50%;transform:translateX(-50%);background:#1c1814;color:#fff;padding:9px 17px;border-radius:20px;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;padding:44px 18px 26px;color:var(--text3)}
.empty-ico{font-size:44px;margin-bottom:11px;opacity:.6}
.empty-txt{font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-title">Домашний помощник</div></div>
<div class="content">
  <div class="tab active" id="tab-stock">
    <div class="search-row">
      <div class="search">
        <svg class="ns" style="width:15px;height:15px;color:var(--text3)" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" placeholder="Поиск…" id="srchInp" oninput="renderStock()">
      </div>
      <button class="icon-btn" id="filterBtn" onclick="openFilters()">
        <svg class="ns" style="width:14px;height:14px" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>Фильтры
      </button>
      <button class="icon-btn" onclick="openCatSort()" title="Порядок категорий">
        <svg class="ns" style="width:14px;height:14px" viewBox="0 0 24 24"><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><polyline points="8 3 3 9 8 15"/></svg>
      </button>
    </div>
    <div id="stockList"></div>
  </div>

  <div class="tab" id="tab-shop">
    <div class="total-wrap">
      <div class="total-lbl">Итого к покупке</div>
      <div class="total-amt" id="totalAmt">0 ₽</div>
      <div class="total-row">
        <div class="total-count" id="totalCnt"></div>
        <button class="total-btn" onclick="clearChecked()">✓ Куплено</button>
        <button class="total-btn danger" onclick="clearAllCart()">🗑 Очистить</button>
      </div>
    </div>
    <div class="list-acts">
      <button class="list-act" onclick="addLowToList()">+ Нет и заканчивается</button>
      <button class="list-act" onclick="openAddShopM()">+ Вручную</button>
    </div>
    <div id="shopList"></div>
  </div>

  <div class="tab" id="tab-meals">
    <div class="meal-subtabs">
      <button class="mst active" onclick="switchMT('recipes',this)">Рецепты</button>
      <button class="mst" onclick="switchMT('planned',this)">Планирую</button>
      <button class="mst" onclick="switchMT('cooked',this)">Готово</button>
    </div>
    <div id="mealContent"></div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchTab('stock',this)" id="nb-stock">
    <svg class="ns" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
    <span>Запасы</span>
  </button>
  <button class="nav-btn" onclick="switchTab('shop',this)" id="nb-shop">
    <svg class="ns" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span>Покупки</span>
  </button>
  <button class="nav-btn" onclick="switchTab('meals',this)" id="nb-meals">
    <svg class="ns" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
    <span>Блюда</span>
  </button>
</nav>
<button class="fab" id="fabBtn" onclick="fabClick()">+</button>
<div class="toast" id="toast"></div>

<!-- ДОБАВИТЬ ТОВАР -->
<div class="overlay" id="addItemM">
  <div class="modal"><div class="modal-handle"></div><div class="modal-title">Добавить товар</div>
    <div class="fl"><label>Название</label><input class="fi" id="niName" placeholder="например, Оливки"></div>
    <div class="fl"><label>Категория</label>
      <select class="fsel-m" id="niCat" onchange="onCatChange('niCat','newCatRow')"></select>
      <div class="new-cat-row" id="newCatRow"><input id="newCatInp" placeholder="Название новой категории"></div>
    </div>
    <div class="fl"><label>Цена (₽)</label><input class="fi" id="niPrice" type="number" placeholder="0"></div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeModal('addItemM')">Отмена</button><button class="btn-ok" onclick="saveItem()">Добавить</button></div>
  </div>
</div>

<!-- РЕДАКТИРОВАТЬ ТОВАР -->
<div class="overlay" id="editItemM">
  <div class="modal"><div class="modal-handle"></div><div class="modal-title">Редактировать товар</div>
    <div class="fl"><label>Название</label><input class="fi" id="eiName" placeholder="Название"></div>
    <div class="fl"><label>Категория</label>
      <select class="fsel-m" id="eiCat" onchange="onCatChange('eiCat','eiNewCatRow')"></select>
      <div class="new-cat-row" id="eiNewCatRow"><input id="eiNewCatInp" placeholder="Новая категория"></div>
    </div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeModal('editItemM')">Отмена</button><button class="btn-ok" onclick="saveEditItem()">Сохранить</button></div>
  </div>
</div>

<!-- ДОБАВИТЬ В КОРЗИНУ -->
<div class="overlay" id="addShopM">
  <div class="modal"><div class="modal-handle"></div><div class="modal-title">Добавить в список</div>
    <div class="fl"><label>Найти из Запасов или создать</label>
      <div class="shop-search-wrap">
        <input type="text" class="shop-search-inp" id="shopSearchInp" placeholder="Начните вводить название…" oninput="onShopSearch()" autocomplete="off">
        <div class="shop-dropdown" id="shopDropdown"></div>
      </div>
      <div id="shopSelectedChip" style="display:none"></div>
    </div>
    <div id="shopFormFields" style="display:none">
      <div class="fl"><label>Количество</label>
        <div style="display:flex;gap:7px">
          <input class="fi" id="sAmt" type="number" placeholder="—" style="flex:1">
          <select class="fsel-m" id="sUnit" style="flex:1"><option>г</option><option>кг</option><option selected>шт</option><option>мл</option><option>л</option><option>ст.л.</option><option>ч.л.</option><option>упак</option></select>
        </div>
      </div>
      <div class="fl"><label>Цена (₽)</label><input class="fi" id="sPrice" type="number" placeholder="0"></div>
      <div id="shopNewStockRow" style="display:none">
        <label class="check-row"><input type="checkbox" id="saveNewToStock" checked><span>Сохранить в Запасы</span></label>
        <div class="fl" style="margin-top:10px" id="shopNewCatWrap">
          <label>Категория</label>
          <select class="fsel-m" id="sNewCat" onchange="onCatChange('sNewCat','sNewCatNewRow')"></select>
          <div class="new-cat-row" id="sNewCatNewRow"><input id="sNewCatNewInp" placeholder="Новая категория"></div>
        </div>
      </div>
    </div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeModal('addShopM')">Отмена</button><button class="btn-ok" id="shopAddBtn" onclick="saveShopItem()" disabled style="opacity:.5">Добавить</button></div>
  </div>
</div>

<!-- РЕЦЕПТ -->
<div class="overlay" id="addRecipeM">
  <div class="modal"><div class="modal-handle"></div><div class="modal-title" id="recipeMTitle">Новый рецепт</div>
    <div class="fl"><label>Фото блюда</label>
      <div class="photo-upload" id="photoUpload" onclick="document.getElementById('photoFile').click()">
        <span class="photo-ico-up">📷</span><span class="photo-upload-txt">Нажмите, чтобы добавить фото</span>
      </div>
      <input type="file" id="photoFile" accept="image/*" onchange="loadPhoto(event,'photoUpload')">
    </div>
    <div class="fl"><label>Название блюда</label><input class="fi" id="rName" placeholder="например, Борщ"></div>
    <div class="fl"><label>Ингредиенты</label>
      <div class="ing-modal-list" id="ingList"></div>
      <div class="ing-add-row" style="flex-wrap:wrap;gap:5px">
        <div class="ing-search-wrap">
          <input class="ing-add-name" id="ingName" placeholder="Поиск в Запасах…" oninput="onIngSearch()" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addIng()}">
          <div class="shop-dropdown" id="ingDropdown"></div>
        </div>
        <input class="ing-add-amt" id="ingAmt" type="number" min="0" placeholder="Кол." style="width:60px;flex-shrink:0">

      </div>
    </div>
    <div class="fl"><label>Рецепт и способ приготовления</label>

    <div class="btn-row"><button class="btn-cancel" onclick="closeModal('addRecipeM')">Отмена</button><button class="btn-ok" onclick="saveRecipe()">Сохранить</button></div>
  </div>
</div>

<!-- ВЫБРАТЬ РЕЦЕПТ -->
<div class="overlay" id="pickRecipeM">
  <div class="modal"><div class="modal-handle"></div><div class="modal-title">Выбрать рецепт</div>
    <input class="pick-search" id="pickSearch" placeholder="Поиск…" oninput="renderPickList()">
    <div class="pick-list" id="pickList"></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn-cancel" style="flex:1" onclick="closeModal('pickRecipeM')">Закрыть</button></div>
  </div>
</div>

<!-- БЛЮДО ГОТОВО -->

  </div>

<!-- ФИЛЬТРЫ -->
<div class="overlay" id="filterM">
  <div class="modal"><div class="modal-handle"></div><div class="modal-title">Фильтры</div>

    <div class="btn-row"><button class="btn-cancel" onclick="resetFilters()">Сбросить</button><button class="btn-ok" onclick="applyFilters()">Применить</button></div>
  </div>
</div>

    <div class="btn-row" style="margin-top:14px"><button class="btn-cancel" onclick="closeModal('catSortM')">Закрыть</button><button class="btn-ok" onclick="saveCatOrder()">Сохранить</button></div>
  </div>
</div>

function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){showToast('Ошибка сохранения')}}

{id:'md01',name:'Сырники классические',type:'recipe',photo:'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600&q=80',instructions:'Смешать творог, желтки, муку, сахар, ванилин. По желанию добавить вяленую вишню или пармезан. Сформировать сырники влажными руками. Жарить на смеси сливочного и растительного масла: сначала на огне выше среднего до румяной корочки, затем на слабом огне до готовности. Можно довести в духовке 180°C / 10 мин.',ings:[{name:'Творог',amt:'400',unit:'г'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Мука пшеничная',amt:'35',unit:'г'},{name:'Сахар',amt:'20',unit:'г'},{name:'Ванилин',amt:'1',unit:'г'},{name:'Масло сливочное',amt:'30',unit:'г'},{name:'Масло растительное',amt:'2',unit:'ст.л.'}]},

{id:'md03',name:'Яичные маффины',type:'recipe',photo:null,instructions:'Взбить яйца с молоком, посолить. Мелко нарезать овощи, добавить в смесь. Разлить по смазанной форме для маффинов, сверху фета и половинки черри. Запекать 180°C / 18–20 мин. Заморозить по 2 шт в пакет. Разогрев: 1,5 мин в микроволновке.',ings:[{name:'Яйца',amt:'8',unit:'шт'},{name:'Молоко',amt:'50',unit:'мл'},{name:'Шпинат',amt:'100',unit:'г'},{name:'Томаты черри',amt:'12',unit:'шт'},{name:'Фета',amt:'60',unit:'г'},{name:'Болгарский перец',amt:'1',unit:'шт'}]},
{id:'md04',name:'Омлет с фетой и шпинатом',type:'recipe',photo:null,instructions:'Яйца взбить с солью и перцем. Вылить на разогретую сковороду с оливковым маслом. Когда схватится снизу — выложить шпинат и фету на половину, сложить пополам. Дать прогреться 1 мин.',ings:[{name:'Яйца',amt:'3',unit:'шт'},{name:'Шпинат',amt:'1',unit:'горсть'},{name:'Фета',amt:'30',unit:'г'},{name:'Масло оливковое',amt:'1',unit:'ч.л.'}]},
{id:'md05',name:'Греческий йогурт с орехами',type:'recipe',photo:'https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600&q=80',instructions:'Сложить всё в миску, перемешать. Для заготовки: вечером добавить чиа — утром набухнут, масса станет гуще. Добавить ягоды или банан по желанию.',ings:[{name:'Греческий йогурт',amt:'200',unit:'г'},{name:'Грецкие орехи',amt:'20',unit:'г'},{name:'Мёд',amt:'1',unit:'ч.л.'},{name:'Семена чиа',amt:'1',unit:'ч.л.'}]},
{id:'md06',name:'Хумус домашний',type:'recipe',photo:'https://images.unsplash.com/photo-1505253716362-afaea1d3d1af?w=600&q=80',instructions:'Нут слить и промыть. Пробить блендером нут, тахини, лимонный сок, давленый чеснок, оливковое масло и соль. Добавлять воду по ложке до нужной густоты. Хранится 5 дней, замораживается отлично.',ings:[{name:'Нут консервированный',amt:'400',unit:'г'},{name:'Тахини',amt:'3',unit:'ст.л.'},{name:'Лимон',amt:'1',unit:'шт'},{name:'Чеснок',amt:'1',unit:'зубчик'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'}]},
{id:'md07',name:'Тост с хумусом и яйцом пашот',type:'recipe',photo:'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80',instructions:'В кипящую воду добавить уксус, создать воронку, влить яйцо, варить 3 мин. Хлеб подрумянить, намазать хумус, положить яйцо, рукола сверху. Посыпать паприкой.',ings:[{name:'Цельнозерновой хлеб',amt:'2',unit:'ломтика'},{name:'Яйца',amt:'1',unit:'шт'},{name:'Рукола',amt:'1',unit:'горсть'},{name:'Уксус',amt:'1',unit:'ч.л.'}]},
{id:'md08',name:'Творожные оладьи с мёдом',type:'recipe',photo:'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600&q=80',instructions:'Смешать творог, яйца, муку, мёд, ванилин, соль. Ложкой выкладывать на разогретую сковороду с маслом, жарить по 2–3 мин с каждой стороны. Подавать с мёдом и ягодами. Замораживаются, разогрев 1,5 мин в микроволновке.',ings:[{name:'Творог',amt:'250',unit:'г'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Мука пшеничная',amt:'4',unit:'ст.л.'},{name:'Мёд',amt:'1',unit:'ч.л.'},{name:'Ванилин',amt:'1',unit:'щепотка'},{name:'Масло оливковое',amt:'2',unit:'ст.л.'}]},
{id:'md09',name:'Тост с авокадо и творогом',type:'recipe',photo:'https://images.unsplash.com/photo-1541519227354-08fa5d50c820?w=600&q=80',instructions:'Творог взбить вилкой до кремовости. Авокадо размять с лимонным соком и солью. Хлеб подрумянить — намазать творог, затем авокадо, сверху яйцо вкрутую или всмятку, разрезанное пополам. Посыпать хлопьями перца.',ings:[{name:'Цельнозерновой хлеб',amt:'2',unit:'ломтика'},{name:'Творог',amt:'80',unit:'г'},{name:'Авокадо',amt:'0.5',unit:'шт'},{name:'Яйца',amt:'1',unit:'шт'},{name:'Лимон',amt:'0.5',unit:'шт'}]},
{id:'md10',name:'Запечённый творог с грушей',type:'recipe',photo:null,instructions:'Смешать творог, яйцо, мёд, ванилин. Выложить в форму для запекания. Грушу нарезать тонкими ломтиками, выложить сверху, посыпать корицей и грецкими орехами. Запекать 180°C / 20 мин. Замораживается порциями.',ings:[{name:'Творог',amt:'300',unit:'г'},{name:'Яйца',amt:'1',unit:'шт'},{name:'Мёд',amt:'1.5',unit:'ч.л.'},{name:'Груша',amt:'1',unit:'шт'},{name:'Грецкие орехи',amt:'20',unit:'г'},{name:'Ванилин',amt:'1',unit:'щепотка'},{name:'Корица',amt:'0.5',unit:'ч.л.'}]},
{id:'md11',name:'Куриные котлеты с травами',type:'recipe',photo:null,instructions:'Грудки измельчить блендером до крупного фарша. Лук и чеснок натереть, добавить к фаршу. Добавить яйцо, сухари, рубленую петрушку, соль, перец. Перемешать, убрать в холодильник на 20 мин. Формировать мокрыми руками, обжарить по 3–4 мин с каждой стороны. Заморозить слоем, затем сложить в пакет.',ings:[{name:'Куриные грудки',amt:'2',unit:'шт'},{name:'Лук',amt:'1',unit:'шт'},{name:'Чеснок',amt:'2',unit:'зубчика'},{name:'Яйца',amt:'1',unit:'шт'},{name:'Сухари панировочные',amt:'2',unit:'ст.л.'},{name:'Петрушка',amt:'1',unit:'горсть'},{name:'Масло оливковое',amt:'2',unit:'ст.л.'}]},
{id:'md12',name:'Запечённые грудки в лимонном маринаде',type:'recipe',photo:'https://images.unsplash.com/photo-1598103442097-8b74394b95c1?w=600&q=80',instructions:'Смешать оливковое масло, лимонный сок и цедру, давленый чеснок, орегано, тимьян, соль, перец. Грудки надрезать поперёк на 1 см — маринад проникнет внутрь. Мариновать минимум 30 мин (лучше 2–3 часа). Запекать 180°C / 25–30 мин. Разогрев: духовка 160°C / 15 мин с ложкой воды.',ings:[{name:'Куриные грудки',amt:'2',unit:'шт'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Лимон',amt:'1',unit:'шт'},{name:'Чеснок',amt:'3',unit:'зубчика'},{name:'Орегано',amt:'1',unit:'ч.л.'},{name:'Тимьян',amt:'0.5',unit:'ч.л.'}]},
{id:'md13',name:'Отварная курица для боулов',type:'recipe',photo:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&q=80',instructions:'Залить грудки холодной водой, добавить соль, лавровый лист, перец, морковь. Довести до кипения, снять пену. Варить на минимальном огне 20–25 мин под крышкой. Дать остыть в бульоне — мясо будет сочным. Разобрать на волокна или нарезать кубиками. Заморозить порциями по 150 г.',ings:[{name:'Куриные грудки',amt:'2',unit:'шт'},{name:'Лавровый лист',amt:'2',unit:'шт'},{name:'Перец горошком',amt:'6',unit:'шт'},{name:'Морковь',amt:'0.5',unit:'шт'}]},
{id:'md14',name:'Курица по-марокански с нутом',type:'recipe',photo:'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?w=600&q=80',instructions:'Бёдра нарезать, обжарить до корочки — вынуть. Обжарить лук 7 мин, добавить чеснок и специи, жарить 1 мин. Добавить томаты и бульон, закипятить. Вернуть курицу и нут. Тушить 35 мин под крышкой, 5–10 мин без крышки. После заморозки вкуснее.',ings:[{name:'Куриные бёдра',amt:'3',unit:'шт'},{name:'Нут консервированный',amt:'400',unit:'г'},{name:'Томаты консервированные',amt:'300',unit:'г'},{name:'Лук',amt:'1',unit:'шт'},{name:'Чеснок',amt:'3',unit:'зубчика'},{name:'Куриный бульон',amt:'200',unit:'мл'},{name:'Масло оливковое',amt:'2',unit:'ст.л.'},{name:'Зира',amt:'1',unit:'ч.л.'},{name:'Паприка копчёная',amt:'1',unit:'ч.л.'}]},
{id:'md15',name:'Голени с чесноком и розмарином',type:'recipe',photo:null,instructions:'Смешать масло, чеснок, розмарин, лимонный сок, соль, перец, паприку. Голени обсушить бумажным полотенцем. Залить маринадом, оставить минимум 1 час (лучше на ночь). Запекать 200°C / 35–40 мин, перевернуть раз в середине. Разогрев: духовка 180°C / 20 мин.',ings:[{name:'Куриные голени',amt:'6',unit:'шт'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Чеснок',amt:'4',unit:'зубчика'},{name:'Розмарин',amt:'3',unit:'веточки'},{name:'Лимон',amt:'0.5',unit:'шт'},{name:'Паприка копчёная',amt:'0.5',unit:'ч.л.'}]},
{id:'md16',name:'Пряные запечённые крылышки',type:'recipe',photo:null,instructions:'Смешать мёд, соевый соус, масло, паприку, давленый чеснок, лимонный сок. Крылышки обсушить, залить маринадом на 30 мин. Запекать 200°C / 30–35 мин, перевернуть на 20-й минуте. Последние 5 мин включить гриль.',ings:[{name:'Куриные крылышки',amt:'6',unit:'шт'},{name:'Мёд',amt:'1',unit:'ст.л.'},{name:'Соевый соус',amt:'2',unit:'ст.л.'},{name:'Масло оливковое',amt:'2',unit:'ст.л.'},{name:'Паприка копчёная',amt:'1',unit:'ч.л.'},{name:'Чеснок',amt:'2',unit:'зубчика'},{name:'Лимон',amt:'0.5',unit:'шт'}]},
{id:'md17',name:'Куриный бульон',type:'recipe',photo:'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=600&q=80',instructions:'Каркасы залить холодной водой, закипятить — слить, промыть каркасы и кастрюлю. Залить свежей водой, добавить овощи и специи. Варить 2,5–3 часа на минимальном огне без крышки. Процедить, остудить, убрать на ночь в холодильник — снять жир утром. Заморозить в контейнерах 300–500 мл.',ings:[{name:'Куриные каркасы',amt:'3',unit:'шт'},{name:'Морковь',amt:'2',unit:'шт'},{name:'Лук',amt:'2',unit:'шт'},{name:'Сельдерей',amt:'3',unit:'стебля'},{name:'Чеснок',amt:'1',unit:'головка'},{name:'Лавровый лист',amt:'3',unit:'шт'},{name:'Перец горошком',amt:'10',unit:'шт'}]},
{id:'md18',name:'Кускус с овощами',type:'recipe',photo:null,instructions:'Овощи нарезать кубиком, обжарить на масле 7–8 мин. Кускус залить кипящим бульоном (240 мл на 200 г), добавить куркуму и соль, накрыть на 5 мин. Разрыхлить вилкой, смешать с овощами, заправить лимоном и маслом, добавить петрушку. Заморозить без зелени.',ings:[{name:'Кускус',amt:'200',unit:'г'},{name:'Болгарский перец',amt:'1',unit:'шт'},{name:'Цукини',amt:'1',unit:'шт'},{name:'Красный лук',amt:'0.5',unit:'шт'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Лимон',amt:'1',unit:'шт'},{name:'Петрушка',amt:'1',unit:'горсть'}]},
{id:'md19',name:'Булгур с зеленью',type:'recipe',photo:null,instructions:'Булгур промыть, залить кипящей водой или бульоном 1:2, посолить. Варить на минимальном огне под крышкой 15 мин, дать постоять 10 мин. Заправить маслом и лимоном, добавить рубленую зелень. Заморозить без зелени.',ings:[{name:'Булгур',amt:'200',unit:'г'},{name:'Масло оливковое',amt:'2',unit:'ст.л.'},{name:'Лимон',amt:'1',unit:'шт'},{name:'Петрушка',amt:'1',unit:'пучок'},{name:'Мята',amt:'1',unit:'веточка'}]},
{id:'md20',name:'Чечевица с лимоном',type:'recipe',photo:null,instructions:'Чечевицу промыть, залить водой 1:3, варить 20–25 мин, слить. Обжарить лук до золотистого, добавить чеснок и зиру, жарить 1 мин. Смешать с чечевицей, заправить лимонным соком и цедрой. Замораживается отлично.',ings:[{name:'Чечевица',amt:'200',unit:'г'},{name:'Лук',amt:'1',unit:'шт'},{name:'Чеснок',amt:'3',unit:'зубчика'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Лимон',amt:'1',unit:'шт'},{name:'Зира',amt:'1',unit:'ч.л.'}]},
{id:'md21',name:'Фарро с грибами',type:'recipe',photo:null,instructions:'Фарро замочить 30 мин, отварить 25–30 мин, слить. Грибы обжарить на сильном огне без помешивания до румяности. Добавить лук, чеснок, тимьян, жарить 5 мин. Смешать с фарро, добавить соевый соус.',ings:[{name:'Фарро',amt:'200',unit:'г'},{name:'Шампиньоны',amt:'300',unit:'г'},{name:'Лук',amt:'1',unit:'шт'},{name:'Чеснок',amt:'2',unit:'зубчика'},{name:'Тимьян',amt:'1',unit:'ч.л.'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Соевый соус',amt:'1',unit:'ст.л.'}]},
{id:'md22',name:'Запечённые баклажаны',type:'recipe',photo:null,instructions:'Баклажаны нарезать кружками 1,5 см, посолить, оставить 20 мин, промокнуть полотенцем. Выложить на противень, между ними черри и чеснок. Полить маслом, посыпать орегано. Запекать 200°C / 30–35 мин, перевернуть на 20-й минуте.',ings:[{name:'Баклажан',amt:'2',unit:'шт'},{name:'Чеснок',amt:'4',unit:'зубчика'},{name:'Томаты черри',amt:'200',unit:'г'},{name:'Масло оливковое',amt:'4',unit:'ст.л.'},{name:'Орегано',amt:'1',unit:'ч.л.'}]},
{id:'md23',name:'Картошка с розмарином',type:'recipe',photo:'https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=600&q=80',instructions:'Картошку вымыть, крупную разрезать пополам. Смешать с маслом, давленым чесноком, иголками розмарина и специями. Выложить в один слой. Запекать 200°C / 35–40 мин, встряхнуть в середине. Разогрев: обязательно духовка 200°C / 15 мин.',ings:[{name:'Картошка',amt:'700',unit:'г'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Чеснок',amt:'3',unit:'зубчика'},{name:'Розмарин',amt:'2',unit:'веточки'},{name:'Паприка копчёная',amt:'0.5',unit:'ч.л.'}]},
{id:'md24',name:'Полента с травами',type:'recipe',photo:null,instructions:'Довести жидкость до кипения, посолить. Тонкой струйкой всыпать крупу, постоянно помешивая. Варить на минимальном огне 20–25 мин, мешать каждые 3–5 мин. Добавить масло, пармезан и тимьян. Заморозить слоем 2 см, нарезать порциями. Разогрев: обжарить на сковороде с маслом.',ings:[{name:'Кукурузная крупа',amt:'200',unit:'г'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Пармезан',amt:'40',unit:'г'},{name:'Тимьян',amt:'0.5',unit:'ч.л.'}]},
{id:'md25',name:'Греческий салат',type:'recipe',photo:'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=600&q=80',instructions:'Нарезать овощи крупно. Лук замочить в холодной воде на 10 мин — уберёт горечь. Смешать, сверху положить целый кусок феты, полить маслом, посыпать орегано. Не перемешивать.',ings:[{name:'Помидоры',amt:'2',unit:'шт'},{name:'Огурцы',amt:'1',unit:'шт'},{name:'Болгарский перец',amt:'1',unit:'шт'},{name:'Красный лук',amt:'0.5',unit:'шт'},{name:'Маслины',amt:'80',unit:'г'},{name:'Фета',amt:'100',unit:'г'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'},{name:'Орегано',amt:'0.5',unit:'ч.л.'}]},
{id:'md26',name:'Табуле',type:'recipe',photo:null,instructions:'Булгур залить 4 ст.л. кипятка, накрыть на 15 мин, остудить. Петрушку и мяту мелко нарезать ножом (не блендером). Помидоры нарезать кубиком, убрать лишний сок. Смешать всё, заправить маслом и лимоном. Настоять 30 мин.',ings:[{name:'Петрушка',amt:'2',unit:'пучка'},{name:'Мята',amt:'1',unit:'пучок'},{name:'Булгур',amt:'3',unit:'ст.л.'},{name:'Помидоры',amt:'2',unit:'шт'},{name:'Лимон',amt:'1',unit:'шт'},{name:'Масло оливковое',amt:'3',unit:'ст.л.'}]},
{id:'md27',name:'Запечённые средиземноморские овощи',type:'recipe',photo:'https://images.unsplash.com/photo-1546793665-c74683f339c1?w=600&q=80',instructions:'Все овощи нарезать крупно одинакового размера. Черри и чеснок оставить целыми. Смешать с маслом и специями. Выложить в один слой на большой противень — не горкой. Запекать 200°C / 35–40 мин, один раз перемешать.',ings:[{name:'Болгарский перец',amt:'2',unit:'шт'},{name:'Цукини',amt:'1',unit:'шт'},{name:'Баклажан',amt:'1',unit:'шт'},{name:'Томаты черри',amt:'200',unit:'г'},{name:'Красный лук',amt:'1',unit:'шт'},{name:'Чеснок',amt:'4',unit:'зубчика'},{name:'Масло оливковое',amt:'4',unit:'ст.л.'},{name:'Орегано',amt:'1',unit:'ч.л.'},{name:'Тимьян',amt:'0.5',unit:'ч.л.'}]},
{id:'md28',name:'Эклеры',type:'recipe',photo:null,instructions:'Вскипятить воду со сливочным маслом, солью и сахаром. Резко всыпать просеянную муку, энергично мешать, убрав с огня. Вернуть на огонь, мешать 2 мин пока на дне не появится корочка. Остудить. По одному вбивать яйца, вмешивая каждое до консистенции густой сметаны. Отсадить полосками 8–10 см на пергамент. Вариант 1: 200°C / 15 мин, затем 180°C / 10 мин. Вариант 2: 190°C / 30 мин, выключить, приоткрыть дверцу, подсушить 10–15 мин.',ings:[{name:'Масло сливочное',amt:'100',unit:'г'},{name:'Яйца',amt:'4',unit:'шт'},{name:'Мука пшеничная',amt:'150',unit:'г'},{name:'Сахар',amt:'1',unit:'ч.л.'},{name:'Соль',amt:'1',unit:'ч.л.'}]},
{id:'md29',name:'Капкейки с кремом чиз',type:'recipe',photo:null,instructions:'Тесто: мягкое масло растереть с сахаром, добавить яйца и ванилин. Добавить муку с разрыхлителем и какао, влить молоко. Выпекать 180°C / 25 мин. Крем чиз: взбить сливки до пиков, добавить маскарпоне и сгущёнку, взбить до однородности. Нанести на остывшие капкейки.',ings:[{name:'Мука пшеничная',amt:'220',unit:'г'},{name:'Масло сливочное',amt:'110',unit:'г'},{name:'Молоко',amt:'170',unit:'мл'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Сахар',amt:'210',unit:'г'},{name:'Какао',amt:'2',unit:'ст.л.'},{name:'Разрыхлитель',amt:'1',unit:'ч.л.'},{name:'Ванилин',amt:'1',unit:'г'},{name:'Сливки 35%',amt:'200',unit:'мл'},{name:'Маскарпоне',amt:'500',unit:'г'},{name:'Сгущёнка',amt:'3',unit:'ст.л.'}]},
{id:'md30',name:'Дрожжевое тесто',type:'recipe',photo:null,instructions:'Опара: смешать тёплое молоко, 1 ст.л. сахара, дрожжи и четверть стакана муки. Поставить на 30 мин. Добавить оставшийся сахар, растопленное масло, яйца и оставшуюся муку. Вымесить до мягкого гладкого теста, которое не липнет к рукам.',ings:[{name:'Молоко',amt:'125',unit:'мл'},{name:'Сахар',amt:'4',unit:'ст.л.'},{name:'Масло сливочное',amt:'85',unit:'г'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Мука пшеничная',amt:'400',unit:'г'}]},
{id:'md31',name:'Кунжутное печенье',type:'recipe',photo:null,instructions:'Смешать муку, соль, разрыхлитель. Растереть мягкое масло с сахаром, добавить яйца и ванилин. Соединить с сухой смесью и добавить кунжут. Скатать шарики, выложить на пергамент. Выпекать 180°C / 10–15 мин до золотистого цвета.',ings:[{name:'Масло сливочное',amt:'120',unit:'г'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Мука пшеничная',amt:'140',unit:'г'},{name:'Кунжут',amt:'320',unit:'г'},{name:'Сахар',amt:'250',unit:'г'},{name:'Ванилин',amt:'1',unit:'г'},{name:'Разрыхлитель',amt:'1',unit:'ч.л.'},{name:'Соль',amt:'1',unit:'щепотка'}]},
{id:'md32',name:'Павлова',type:'recipe',photo:null,instructions:'Протереть чашу и венчик долькой лимона. Взбивать белки 5 мин, постепенно добавляя сахар, до устойчивых пиков. В конце добавить крахмал и ванилин. Выложить на пергамент кругом. Выпекать на нижнем уровне при 80°C / 1,5 часа. Выключить духовку, оставить с приоткрытой дверцей ещё 1 час.',ings:[{name:'Яйца',amt:'3',unit:'белка'},{name:'Сахар',amt:'200',unit:'г'},{name:'Крахмал кукурузный',amt:'1',unit:'ч.л.'},{name:'Ванилин',amt:'1',unit:'г'},{name:'Лимон',amt:'0.5',unit:'шт'}]},
{id:'md33',name:'Оладьи на дрожжах',type:'recipe',photo:null,instructions:'Опара: смешать тёплое молоко (400 мл), сахар, дрожжи и муку (300 г). Оставить 30 мин. Вбить яйца, добавить соль и ванилин, влить в опару. Добавить оставшуюся муку (200 г), оставить 30 мин. Влить растительное масло. Жарить на умеренном огне.',ings:[{name:'Молоко',amt:'400',unit:'мл'},{name:'Сахар',amt:'2',unit:'ст.л.'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Мука пшеничная',amt:'500',unit:'г'},{name:'Масло растительное',amt:'2',unit:'ст.л.'},{name:'Ванилин',amt:'1',unit:'щепотка'}]},
{id:'md34',name:'Салат Мимоза',type:'recipe',photo:null,instructions:'Картошку, яйца и морковь отварить заранее. Слои снизу вверх: тёртый картофель + майонез + соль; размятая сайра; мелко нарезанный лук; тёртые белки + майонез; тёртая морковь + майонез; тёртые желтки сверху. Настоять в холодильнике 2 часа.',ings:[{name:'Картошка',amt:'3',unit:'шт'},{name:'Яйца',amt:'4',unit:'шт'},{name:'Сайра консервированная',amt:'1',unit:'банка'},{name:'Лук',amt:'1',unit:'шт'},{name:'Морковь',amt:'2',unit:'шт'},{name:'Майонез',amt:'200',unit:'г'}]},
{id:'md35',name:'Морковный кекс',type:'recipe',photo:null,instructions:'Смешать растительное масло, сахар и яйца. Отдельно смешать муку, корицу, шафран и разрыхлитель. Соединить, добавить морковь на мелкой тёрке и грецкие орехи. Выложить в форму. Выпекать 175°C / 20 мин.',ings:[{name:'Масло растительное',amt:'150',unit:'г'},{name:'Сахар',amt:'200',unit:'г'},{name:'Яйца',amt:'2',unit:'шт'},{name:'Мука пшеничная',amt:'220',unit:'г'},{name:'Корица',amt:'1',unit:'ч.л.'},{name:'Шафран',amt:'1',unit:'щепотка'},{name:'Разрыхлитель',amt:'1',unit:'ч.л.'},{name:'Морковь',amt:'100',unit:'г'},{name:'Грецкие орехи',amt:'70',unit:'г'}]},
{id:'md36',name:'Бисквит классический',type:'recipe',photo:null,instructions:'5 яиц разделить: 4 желтка + 3 целых яйца взбить с сахаром. Добавить муку, разрыхлитель, ванилин. Оставшиеся белки взбить до пиков, аккуратно вмешать в тесто. Выпекать в разогретой духовке 160–170°C / 50 мин. Оставить в выключенной духовке 10 мин. Если опал — огонь выше; если быстро румянится — снизить.',ings:[{name:'Яйца',amt:'5',unit:'шт'},{name:'Сахар',amt:'150',unit:'г'},{name:'Мука пшеничная',amt:'150',unit:'г'},{name:'Разрыхлитель',amt:'1',unit:'ч.л.'},{name:'Ванилин',amt:'1',unit:'г'}]},
{id:'md37',name:'Шарлотка',type:'recipe',photo:null,instructions:'Взбить яйца с солью и сахаром 5–10 мин до пышности. Добавить муку, сметану, цедру лимона, перемешать. Яблоки очистить, нарезать ломтиками. Смазать форму маслом, выложить яблоки на дно. Залить тестом. Выпекать 180°C / 30–40 мин.',ings:[{name:'Яйца',amt:'4',unit:'шт'},{name:'Яблоко',amt:'4',unit:'шт'},{name:'Сахар',amt:'150',unit:'г'},{name:'Мука пшеничная',amt:'150',unit:'г'},{name:'Сметана',amt:'1',unit:'ст.л.'},{name:'Ванилин',amt:'1',unit:'г'},{name:'Лимон',amt:'0.5',unit:'шт'}]}

let meals=ld('mls9',[]);
if(meals.length===0){meals=MEAL_DEFS.map(m=>({...m}));sv('mls9',meals);}
let cooked=ld('ckd9',[]);
let customCats=ld('ucat9',[]);
let catOrder=ld('cord9',[]);

function allCats(){
  const all=[...BASE_CATS,...customCats.filter(c=>!BASE_CATS.includes(c))];
  if(catOrder.length){const o=catOrder.filter(c=>all.includes(c));return[...o,...all.filter(c=>!o.includes(c))];}
  return all;
}
function usedCats(){return[...new Set(items.map(i=>i.cat).filter(Boolean))]}
function findItem(name){return items.find(i=>i.name.toLowerCase().trim()===name.toLowerCase().trim())}
function findItem2(id){return items.find(i=>i.id===id)}

let curTab='stock',curMT='recipes',stockFilt='all',catFilt='all',tmpSF='all',tmpCF='all';
let editingId=null,cookingId=null,editingItemId=null;
let tmpIngs=[],tmpPhoto=null,tmpCatOrder=[];
let shopSelectedItem=null;

function switchTab(t,btn){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');btn.classList.add('active');curTab=t;
  if(t==='stock')renderStock();if(t==='shop')renderShop();if(t==='meals')renderMeals();
}
function switchMT(t,btn){
  document.querySelectorAll('.mst').forEach(x=>x.classList.remove('active'));btn.classList.add('active');curMT=t;
  document.getElementById('fabBtn').style.display=t==='cooked'?'none':'';
  renderMeals();
}

function openFilters(){
  tmpSF=stockFilt;tmpCF=catFilt;
  document.getElementById('fStockPills').innerHTML=[{v:'all',l:'Все'},{v:'много',l:'Много'},{v:'норм',l:'Норм'},{v:'заканчивается',l:'Заканч.'},{v:'нет',l:'Нет'}].map(({v,l})=>`<button class="fpill f-${v}${tmpSF===v?' on':''}" onclick="setTmpSF('${v}',this)">${l}</button>`).join('');
  document.getElementById('fCatPills').innerHTML=['all',...usedCats()].map(c=>`<button class="fpill${tmpCF===c?' on':''}" onclick="setTmpCF('${escQ(c)}',this)">${c==='all'?'Все':c}</button>`).join('');
  openModal('filterM');
}
function setTmpSF(v,btn){tmpSF=v;document.querySelectorAll('#fStockPills .fpill').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function setTmpCF(v,btn){tmpCF=v;document.querySelectorAll('#fCatPills .fpill').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function applyFilters(){stockFilt=tmpSF;catFilt=tmpCF;document.getElementById('filterBtn').classList.toggle('active',stockFilt!=='all'||catFilt!=='all');closeModal('filterM');renderStock();}
function resetFilters(){stockFilt='all';catFilt='all';document.getElementById('filterBtn').classList.remove('active');closeModal('filterM');renderStock();}

function openCatSort(){tmpCatOrder=[...allCats()];renderSortList();openModal('catSortM');}
function renderSortList(){document.getElementById('sortList').innerHTML=tmpCatOrder.map((c,i)=>`<div class="sort-item"><span class="sort-name">${escH(c)}</span><div class="sort-arrows">${i>0?`<button onclick="moveCat(${i},-1)">↑</button>`:'<button disabled style="opacity:.2">↑</button>'}${i<tmpCatOrder.length-1?`<button onclick="moveCat(${i},1)">↓</button>`:'<button disabled style="opacity:.2">↓</button>'}</div></div>`).join('');}
function moveCat(i,d){const j=i+d;if(j<0||j>=tmpCatOrder.length)return;[tmpCatOrder[i],tmpCatOrder[j]]=[tmpCatOrder[j],tmpCatOrder[i]];renderSortList();}
function saveCatOrder(){catOrder=[...tmpCatOrder];saveAll();closeModal('catSortM');renderStock();}

function renderStock(){
  const q=(document.getElementById('srchInp').value||'').toLowerCase().trim();
  let list=items;
  if(q)list=list.filter(i=>i.name.toLowerCase().includes(q));
  if(stockFilt!=='all')list=list.filter(i=>i.stock===stockFilt);
  if(catFilt!=='all')list=list.filter(i=>i.cat===catFilt);
  const cats=allCats();const grp={};cats.forEach(c=>grp[c]=[]);
  list.forEach(i=>{if(grp[i.cat])grp[i.cat].push(i);else{grp['Прочее']||(grp['Прочее']=[]);grp['Прочее'].push(i);}});
  let h='';
  cats.forEach(cat=>{
    const g=grp[cat];if(!g||!g.length)return;
    h+=`<div class="sec"><div class="sec-title">${escH(cat)}</div>`;
    g.forEach(it=>{
      const hist=(it.priceHistory||[]).slice(0,4).map(p=>`<div class="price-hist-row"><span>${fmtDate(p.date)}</span><span>${p.price}₽</span></div>`).join('');
      h+=`<div class="card" id="c-${it.id}">
        <div class="item-row" onclick="toggleD1('${it.id}')">
          <div class="dot ${it.stock}"></div>
          <div class="item-name">${escH(it.name)}</div>
          <div class="item-price${it.price?' set':''}">${it.price?it.price+'₽':'· · ·'}</div>
          <span class="chev" id="chv-${it.id}">›</span>
        </div>
        <div class="item-d1" id="d1-${it.id}">
          <div class="stock-pills">${['много','норм','заканчивается','нет'].map(s=>`<button class="spill${it.stock===s?' a-'+s:''}" onclick="setStock('${it.id}','${s}')">${slbl(s)}</button>`).join('')}</div>
          <div class="d1-actions">
            <button class="d1-btn ${it.inList?'d1-list in':'d1-list'}" onclick="toggleList('${it.id}')">${it.inList?'✓ В списке':'+ В список'}</button>
            <button class="d1-btn d1-more" onclick="toggleD2('${it.id}')">
              <svg style="width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>Подробнее
            </button>
            <button class="d1-btn d1-edit" onclick="openEditItem('${it.id}')">✏️</button>
          </div>
        </div>
        <div class="item-d2" id="d2-${it.id}">
          <div class="d2-field">

function addLowToList(){

  });

function addToCartRaw(name,price,amt,unit,fromMealId){
  const key=name.toLowerCase().trim();
  const ex=shopList.find(s=>!s.checked&&s.name.toLowerCase().trim()===key);
  if(ex){
    const a=parseFloat(amt);
    if(a>0){const ea=parseFloat(ex.amt);if(ex.unit===unit&&ea>0){ex.amt=(ea+a).toString();}else if(!ea||parseFloat(ea)===0){ex.amt=String(a);ex.unit=unit;}else{ex.extraAmts=ex.extraAmts||[];ex.extraAmts.push({amt:String(a),unit});}}
    if(!ex.price&&price)ex.price=price;return;
  }
  shopList.push({id:uid(),name,price,amt:amt?String(amt):'',unit:unit||'',checked:false,fromMealId});
}
function renderShop(){
  const tot=shopList.filter(s=>!s.checked&&s.price).reduce((a,s)=>a+(parseFloat(s.price)||0),0);
  const unc=shopList.filter(s=>!s.checked).length;
  document.getElementById('totalAmt').textContent=tot?tot.toLocaleString('ru')+'₽':'0 ₽';
  document.getElementById('totalCnt').textContent=unc?unc+' '+plr(unc,'товар','товара','товаров'):'Список пуст';
  if(!shopList.length){document.getElementById('shopList').innerHTML=emptyState('🛒','Список пуст');return;}
  let h='';
  [...shopList].sort((a,b)=>a.checked-b.checked).forEach(s=>{
    let a=s.amt&&parseFloat(s.amt)>0?s.amt+(s.unit?' '+s.unit:''):'';
    if(s.extraAmts)s.extraAmts.forEach(e=>{a+=(a?' + ':'')+e.amt+(e.unit?' '+e.unit:'');});
    h+=`<div class="shop-item">
      <div class="shop-chk${s.checked?' on':''}" onclick="chkShop('${s.id}')">${s.checked?'✓':''}</div>
      <div class="shop-name-col"><div class="shop-name-text${s.checked?' done':''}">${escH(s.name)}</div>${s.fromMealId||s.fromId?`<div class="shop-sub">${s.fromMealId?'из рецепта':'из Запасов'}</div>`:''}</div>
      <div class="shop-qty-col"><input class="shop-qty-inp" value="${escH(s.amt||'')}" placeholder="—" onchange="updateCartAmt('${s.id}',this.value)"><span class="shop-qty-unit">${escH(s.unit||'')}</span></div>
      <div class="shop-price-col">${s.price?s.price+'₽':'—'}</div>
      <button class="shop-del" onclick="delShop('${s.id}')">×</button>
    </div>`;
  });
  document.getElementById('shopList').innerHTML=h;
}
function updateCartAmt(id,val){const s=shopList.find(x=>x.id===id);if(s)s.amt=val;saveAll();}
function chkShop(id){const s=shopList.find(x=>x.id===id);if(!s)return;s.checked=!s.checked;if(s.checked&&s.fromId){const it=findItem2(s.fromId);if(it){it.stock='норм';it.inList=false;}}saveAll();renderShop();}
function delShop(id){const s=shopList.find(x=>x.id===id);if(s&&s.fromId){const it=findItem2(s.fromId);if(it)it.inList=false;}shopList=shopList.filter(x=>x.id!==id);saveAll();renderShop();}
function clearChecked(){shopList.filter(s=>s.checked&&s.fromId).forEach(s=>{const it=findItem2(s.fromId);if(it){it.stock='норм';it.inList=false;}});shopList=shopList.filter(s=>!s.checked);saveAll();renderShop();}
function clearAllCart(){if(!confirm('Очистить всю корзину?'))return;items.forEach(it=>it.inList=false);shopList=[];saveAll();renderShop();showToast('Корзина очищена');}

function renderMeals(){
  let h='';
  if(curMT==='recipes'){
    const list=meals.filter(m=>!m.type||m.type==='recipe');
    if(!list.length)h=emptyState('📖','Добавьте первый рецепт кнопкой +');
    else{h='<div class="recipe-grid">';list.forEach(m=>h+=recipeTile(m,'recipe'));h+='</div>';}
  } else if(curMT==='planned'){
    const list=meals.filter(m=>m.type==='planned');
    if(!list.length)h=emptyState('📅','Нажмите + чтобы выбрать рецепт');
    else{h='<div class="recipe-grid">';list.forEach(m=>h+=recipeTile(m,'planned'));h+='</div>';}
  } else{
    if(!cooked.length)h=emptyState('🍽','Готовые блюда появятся здесь');
    else cooked.forEach(c=>h+=cookedCard(c));
  }
  document.getElementById('mealContent').innerHTML=h;
}
function checkIngs(ings){let missing=0,low=0,ok=0;(ings||[]).forEach(ing=>{const it=findItem(ing.name);if(!it||it.stock==='нет')missing++;else if(it.stock==='заканчивается')low++;else ok++;});return{missing,low,ok};}

function recipeTile(m,mode){
  const ic=(m.ings||[]).length;const{missing,low}=checkIngs(m.ings);
  const ph=m.photo
    ?`<div class="recipe-tile-img"><img src="${m.photo}"></div>`
    :`<div class="recipe-tile-img"><svg style="width:36px;height:36px;fill:none;stroke:var(--text3);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></div>`;
  let badges='';
  if(missing>0)badges+=`<span class="recipe-tile-badge" style="background:var(--red-bg);color:var(--red)">✕${missing} нет</span>`;
  else if(low>0)badges+=`<span class="recipe-tile-badge" style="background:var(--yellow-bg);color:var(--yellow)">⚠${low}</span>`;
  else if(ic>0)badges+=`<span class="recipe-tile-badge" style="background:var(--green-bg);color:var(--green)">✓ всё есть</span>`;
  if(mode==='planned')badges=`<span class="recipe-tile-badge" style="background:var(--blue-bg);color:var(--blue)">планирую</span>`+badges;
  return`<div class="recipe-tile" onclick="openRecipeDetail('${m.id}','${mode}')">${ph}<div class="recipe-tile-body"><div class="recipe-tile-name">${escH(m.name)}</div><div class="recipe-tile-meta">${badges}</div></div></div>`;
}

function buildIngCheck(ings,mealId){
  if(!ings||!ings.length)return '<div style="color:var(--text3);font-size:13px;padding:8px 0">Ингредиенты не указаны</div>';
  return'<div class="ing-check-list">'+ings.map(ing=>{
    const it=findItem(ing.name);let cls='unknown',ico='○',status='?';
    if(it){if(it.stock==='много'||it.stock==='норм'){cls='ok';ico='✓';status='есть';}else if(it.stock==='заканчивается'){cls='low';ico='!';status='заканч.';}else{cls='missing';ico='✕';status='нет';}}
    const a=ing.amt&&parseFloat(ing.amt)>0?(ing.amt+' '+(ing.unit||'')):'';
    const needsCart=cls==='missing'||cls==='unknown'||cls==='low';
    const cartBtn=needsCart?`<button class="ing-cart-btn" onclick="addIngInPlace('${escQ(ing.name)}','${escQ(ing.amt||'')}','${escQ(ing.unit||'')}','${mealId}',this)">+ в корзину</button>`:'';
    return`<div class="ing-row ${cls}"><span class="ing-ico">${ico}</span><span class="ing-ing">${escH(ing.name)}</span><span class="ing-amt-tag">${a}</span><span class="ing-status">${status}</span>${cartBtn}</div>`;
  }).join('')+'</div>';
}
function addIngInPlace(name,amt,unit,mealId,btn){
  const it=findItem(name);addToCartRaw(name,it?it.price:null,amt,unit,mealId||null);saveAll();showToast('→ Корзина: '+name);
  if(btn){const orig=btn.textContent,os=btn.style.cssText;btn.textContent='✓ добавлено';btn.style.color='var(--green)';btn.style.background='rgba(78,138,108,0.15)';setTimeout(()=>{btn.textContent=orig;btn.style.cssText=os;},1800);}
}
