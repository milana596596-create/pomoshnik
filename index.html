  const cI=`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
  const pI=`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  const bI=`<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>`;
  const dI=`<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
  let btns=`<button class="rec-btn rb-edit" onclick="openEditRecipe('${m.id}')">${eI}Изменить</button>`;
  if(mode==='recipe'){btns+=`<button class="rec-btn rb-plan" onclick="moveToPlan('${m.id}')">${pI}Готовить</button><button class="rec-btn rb-del" onclick="delMeal('${m.id}')">${dI}Удалить</button>`;}
  else{if(missing>0||low>0)btns+=`<button class="rec-btn rb-shop" onclick="recipeToShop('${m.id}')">${sI}Докупить</button>`;btns+=`<button class="rec-btn rb-cook" onclick="openMarkCooked('${m.id}')">${cI}Готово!</button><button class="rec-btn rb-back" onclick="backToRecipes('${m.id}')">${bI}Назад</button>`;}
  return`<div class="recipe-card" id="rc-${m.id}">${ph}<div class="recipe-body"><div class="recipe-name">${escH(m.name)}</div><div class="recipe-meta"><span>🧅 ${ic} ${plr(ic,'ингредиент','ингредиента','ингредиентов')}</span>${missing>0?`<span style="color:var(--red)">✕ ${missing} нет</span>`:''}${low>0?`<span style="color:var(--yellow)">⚠ ${low} заканч.</span>`:''}${!missing&&!low&&ic>0?`<span style="color:var(--green)">✓ Всё есть</span>`:''}</div></div><div class="recipe-btns">${btns}</div><div class="recipe-detail" id="rd-${m.id}"><div class="detail-hdr">Ингредиенты</div>${buildIngCheck(m.ings,m.id)}</div><button class="recipe-expand-btn" onclick="toggleRD('${m.id}')"><span>Проверить наличие</span><span id="rarr-${m.id}">›</span></button></div>`;
}
function toggleRD(id){const d=document.getElementById('rd-'+id);const was=d.classList.contains('open');d.classList.toggle('open',!was);const a=document.getElementById('rarr-'+id);if(a)a.style.transform=was?'':'rotate(90deg)';}
function recipeToShop(id){const m=meals.find(x=>x.id===id);if(!m)return;(m.ings||[]).forEach(ing=>{const it=findItem(ing.name);if(!it||it.stock==='нет'||it.stock==='заканчивается')addToCartRaw(ing.name,it?it.price:null,ing.amt,ing.unit,m.id);});saveAll();switchTab('shop',document.getElementById('nb-shop'));}
function moveToPlan(id){const m=meals.find(x=>x.id===id);if(!m)return;if(m.type==='planned'){showToast('Уже в «Планирую»');return;}m.type='planned';(m.ings||[]).forEach(ing=>{const it=findItem(ing.name);if(!it||it.stock==='нет'||it.stock==='заканчивается')addToCartRaw(ing.name,it?it.price:null,ing.amt,ing.unit,m.id);});saveAll();renderMeals();showToast('Перемещено в «Планирую»');}
function backToRecipes(id){const m=meals.find(x=>x.id===id);if(m){m.type='recipe';saveAll();renderMeals();}}
function delMeal(id){if(!confirm('Удалить рецепт?'))return;meals=meals.filter(m=>m.id!==id);saveAll();renderMeals();}

function openPickRecipe(){document.getElementById('pickSearch').value='';renderPickList();openModal('pickRecipeM');}
function renderPickList(){
  const q=document.getElementById('pickSearch').value.toLowerCase().trim();
  const list=meals.filter(m=>(!m.type||m.type==='recipe')&&(!q||m.name.toLowerCase().includes(q)));
  if(!list.length){document.getElementById('pickList').innerHTML='<div style="color:var(--text3);text-align:center;padding:20px">Нет доступных рецептов</div>';return;}
  document.getElementById('pickList').innerHTML=list.map(m=>{
    const ph=m.photo?`<img class="pick-photo" src="${m.photo}">`:`<div class="pick-photo-ph">🥘</div>`;
    const ic=(m.ings||[]).length;
    return`<div class="pick-item" onclick="pickAndPlan('${m.id}')">${ph}<div><div class="pick-name">${escH(m.name)}</div><div class="pick-meta">${ic} ${plr(ic,'ингредиент','ингредиента','ингредиентов')}</div></div></div>`;
  }).join('');
}
function pickAndPlan(id){closeModal('pickRecipeM');moveToPlan(id);}

function openMarkCooked(id){cookingId=id;const m=meals.find(x=>x.id===id);document.getElementById('cookedMealName').textContent=m?m.name:'';document.getElementById('cookedPortions').value='1';document.getElementById('cookedNotes').value='';const r=document.querySelector('input[name="cookedSt"][value="fresh"]');if(r)r.checked=true;openModal('markCookedM');}
function saveCookedDish(){const m=meals.find(x=>x.id===cookingId);if(!m)return;const st=document.querySelector('input[name="cookedSt"]:checked').value;const portions=parseInt(document.getElementById('cookedPortions').value)||1;const notes=document.getElementById('cookedNotes').value.trim();cooked.unshift({id:uid(),mealId:m.id,name:m.name,photo:m.photo,status:st,portions,notes,date:today(),ings:m.ings});m.type='recipe';cookingId=null;saveAll();closeModal('markCookedM');renderMeals();}

function cookedCard(c){
  const stMap={fresh:{cls:'st-fresh',lbl:'Готово'},frozen:{cls:'st-frozen',lbl:'Заморожено'},semi:{cls:'st-semi',lbl:'Полуфабрикат'}};
  const st=stMap[c.status]||stMap.fresh;
  const ph=c.photo?`<img class="cooked-photo" src="${c.photo}" style="min-height:100px;height:100%">`:`<div class="cooked-photo-ph">🍽</div>`;
  return`<div class="cooked-card">${ph}<div class="cooked-info"><div class="cooked-name">${escH(c.name)}</div><span class="cooked-status ${st.cls}">${st.lbl}</span><div class="cooked-date">${c.date?'Готово '+fmtDate(c.date):''}${c.notes?' · '+escH(c.notes):''}</div><div class="portion-row"><button class="port-btn" onclick="chgPort('${c.id}',-1)">−</button><div class="port-n">${c.portions||0}</div><button class="port-btn" onclick="chgPort('${c.id}',1)">+</button><div class="port-lbl">${plr(c.portions||0,'порция','порции','порций')}</div></div></div><button class="cooked-del" onclick="delCooked('${c.id}')">×</button></div>`;
}
function chgPort(id,d){const c=cooked.find(x=>x.id===id);if(!c)return;c.portions=Math.max(0,(c.portions||0)+d);saveAll();renderMeals();}
function delCooked(id){if(!confirm('Удалить?'))return;cooked=cooked.filter(c=>c.id!==id);saveAll();renderMeals();}

function onIngSearch(){
  const q=document.getElementById('ingName').value.trim();
  const dd=document.getElementById('ingDropdown');
  if(!q){dd.classList.remove('open');return;}
  const matches=items.filter(i=>i.name.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  const dcol={много:'var(--green)',норм:'var(--yellow)',заканчивается:'var(--red)',нет:'var(--border)'};
  let h=matches.map(it=>`<div class="sdrop-item" onclick="selectIngItem('${escQ(it.name)}')"><div class="sdrop-dot" style="background:${dcol[it.stock]||'var(--border)'}"></div><span class="sdrop-name">${escH(it.name)}</span><span class="sdrop-cat">${escH(it.cat)}</span></div>`).join('');
  const exact=items.find(i=>i.name.toLowerCase().trim()===q.toLowerCase().trim());
  if(!exact)h+=`<div class="sdrop-item" onclick="addIngNewToStock('${escQ(q)}')"><span class="sdrop-new">➕ Добавить «${escH(q)}» в Запасы и рецепт</span></div>`;
  dd.innerHTML=h;dd.classList.add('open');
}
function selectIngItem(name){
  document.getElementById('ingName').value=name;
  document.getElementById('ingDropdown').classList.remove('open');
  document.getElementById('ingAmt').focus();
}
function addIngNewToStock(name){
  if(!findItem(name)){
    items.push({id:uid(),name,cat:'Прочее',stock:'нет',price:null,inList:false,notes:'',url:'',priceHistory:[]});
    saveAll();showToast('Добавлено в Запасы: '+name);
  }
  document.getElementById('ingName').value=name;
  document.getElementById('ingDropdown').classList.remove('open');
  document.getElementById('ingAmt').focus();
}
function addIng(){
  const n=document.getElementById('ingName').value.trim();if(!n)return;
  if(!findItem(n)){showToast('Сначала выберите продукт из Запасов');return;}
  const amt=document.getElementById('ingAmt').value.trim();const unit=document.getElementById('ingUnit').value;
  tmpIngs.push({name:n,amt,unit});
  document.getElementById('ingName').value='';document.getElementById('ingAmt').value='';
  document.getElementById('ingDropdown').classList.remove('open');
  renderIngList();document.getElementById('ingName').focus();
}
function removeIng(i){tmpIngs.splice(i,1);renderIngList();}
function moveIng(i,d){const j=i+d;if(j<0||j>=tmpIngs.length)return;[tmpIngs[i],tmpIngs[j]]=[tmpIngs[j],tmpIngs[i]];renderIngList();}
function renderIngList(){
  document.getElementById('ingList').innerHTML=tmpIngs.map((ing,i)=>`
    <div class="ing-modal-row">
      <div style="display:flex;flex-direction:column;gap:2px;margin-right:3px">
        <button class="ing-move-btn" onclick="moveIng(${i},-1)" ${i===0?'disabled':''}>▲</button>
        <button class="ing-move-btn" onclick="moveIng(${i},1)" ${i===tmpIngs.length-1?'disabled':''}>▼</button>
      </div>
      <span class="ing-m-name">${escH(ing.name)}</span>
      <span class="ing-m-amt">${ing.amt&&parseFloat(ing.amt)>0?ing.amt+' '+ing.unit:''}</span>
      <button class="ing-m-del" onclick="removeIng(${i})">×</button>
    </div>`).join('');
}
function openEditRecipe(id){
  const m=meals.find(x=>x.id===id);if(!m)return;
  editingId=id;
  document.getElementById('recipeMTitle').textContent='Редактировать рецепт';
  document.getElementById('rName').value=m.name;
  document.getElementById('rInstructions').value=m.instructions||'';
  tmpIngs=[...(m.ings||[]).map(i=>({...i}))];tmpPhoto=m.photo||null;
  const pu=document.getElementById('photoUpload');
  pu.innerHTML=tmpPhoto?`<img src="${tmpPhoto}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">`:`<span class="photo-ico-up">📷</span><span class="photo-upload-txt">Нажмите, чтобы добавить фото</span>`;
  renderIngList();openModal('addRecipeM');
}
function clearRecipeForm(){
  editingId=null;tmpIngs=[];tmpPhoto=null;
  document.getElementById('rName').value='';
  document.getElementById('rInstructions').value='';
  document.getElementById('ingName').value='';
  document.getElementById('ingAmt').value='';
  document.getElementById('ingDropdown').classList.remove('open');
  document.getElementById('photoUpload').innerHTML=`<span class="photo-ico-up">📷</span><span class="photo-upload-txt">Нажмите, чтобы добавить фото</span>`;
  document.getElementById('photoFile').value='';
  document.getElementById('recipeMTitle').textContent='Новый рецепт';
  renderIngList();
}
function saveRecipe(){
  const lN=document.getElementById('ingName').value.trim();
  if(lN&&findItem(lN)){const amt=document.getElementById('ingAmt').value.trim();const unit=document.getElementById('ingUnit').value;tmpIngs.push({name:lN,amt,unit});}
  const name=document.getElementById('rName').value.trim();if(!name)return;
  const instructions=document.getElementById('rInstructions').value.trim();
  if(editingId){const m=meals.find(x=>x.id===editingId);if(m){m.name=name;m.photo=tmpPhoto;m.ings=[...tmpIngs];m.instructions=instructions;}}
  else meals.push({id:uid(),name,photo:tmpPhoto,type:'recipe',ings:[...tmpIngs],instructions});
  saveAll();closeModal('addRecipeM');clearRecipeForm();renderMeals();
}

function onCatChange(selId,rowId){document.getElementById(rowId).style.display=document.getElementById(selId).value==='__new__'?'block':'none';}
function openAddItemM(){
  document.getElementById('niName').value='';document.getElementById('niPrice').value='';
  document.getElementById('newCatRow').style.display='none';document.getElementById('newCatInp').value='';
  document.getElementById('niCat').innerHTML=allCats().map(c=>`<option>${escH(c)}</option>`).join('')+'<option value="__new__">➕ Новая…</option>';
  openModal('addItemM');
}
function saveItem(){
  const n=document.getElementById('niName').value.trim();if(!n)return;
  let cat=document.getElementById('niCat').value;
  if(cat==='__new__'){cat=document.getElementById('newCatInp').value.trim();if(!cat)return;if(!customCats.includes(cat))customCats.push(cat);}
  const p=parseFloat(document.getElementById('niPrice').value)||null;
  items.push({id:uid(),name:n,cat,stock:'норм',price:p,inList:false,notes:'',url:'',priceHistory:[]});
  saveAll();closeModal('addItemM');renderStock();
}

function loadPhoto(e,upId){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const ratio=Math.min(700/img.width,700/img.height,1);const c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);tmpPhoto=c.toDataURL('image/jpeg',0.78);document.getElementById(upId).innerHTML=`<img src="${tmpPhoto}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">`;};img.src=ev.target.result;};r.readAsDataURL(file);
}
function fabClick(){
  if(curTab==='stock')openAddItemM();
  else if(curTab==='shop')openAddShopM();
  else if(curMT==='planned')openPickRecipe();
  else if(curMT==='recipes'){clearRecipeForm();openModal('addRecipeM');}
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});});
document.addEventListener('click',e=>{
  if(!e.target.closest('.shop-search-wrap'))document.getElementById('shopDropdown').classList.remove('open');
  if(!e.target.closest('.ing-search-wrap'))document.getElementById('ingDropdown').classList.remove('open');
});

function plr(n,a,b,c){const m=n%100,r=n%10;if(m>=11&&m<=14)return c;if(r===1)return a;if(r>=2&&r<=4)return b;return c;}
function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(d){try{return new Date(d).toLocaleDateString('ru',{day:'numeric',month:'short'})}catch(e){return d}}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escQ(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function emptyState(ico,txt){return`<div class="empty"><div class="empty-ico">${ico}</div><div class="empty-txt">${txt}</div></div>`}
let _tt;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2500);}

renderStock();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
